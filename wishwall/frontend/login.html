<!DOCTYPE html>
    <head>
        <link rel="stylesheet" href="./public/style/login.css">
    </head>


    <body>
        <div class="container">
            <div class="tabs">
                <button type="button" class="tab active" id="login" >Login</button>
                <button type="button" class="tab inactive" id="register" >Register</button>
            </div>

            <form>

                <input type="text" class="field" placeholder="Enter email" id="userName" autofocus>
                <input type="text" class="field hidden" placeholder="Enter name" id="name">
                <input type="number" class="field hidden" placeholder="Enter age" id="age">
                <input type="password" class="field" placeholder="Enter password" id="password">

                <div class="actions">
                    <button type="reset" class="reset">RESET</button>
                    <button type="submit" id="submit" class="submit">LOGIN</button>
                </div>

                <button id="google" class="google">Continue with Google <img src="./public/image/googleLogo.png" alt=""></button>
            </form>
        </div>

        <script>
            const emailBox = document.getElementById('userName')
            const passwordBox = document.getElementById('password')
            const nameBox = document.getElementById('name');
            const ageBox = document.getElementById('age');
            
            async function loginSuccessful(name, id){
                console.log("login successful");
                await localStorage.setItem("name", name);
                await localStorage.setItem("userId", id);
                window.location.href = "/messaging.html";
            }

            function registerSuccessful(){
                alert("Registration successful!");
                setActive(loginTab, registerTab);
                sub.textContent = "LOGIN";
                nameBox.classList.add("hidden");
                ageBox.classList.add("hidden");

                resetVal();
            }

            function loginFailed(reason){
                if(reason == "email"){
                    alert("You suck loser... Register for an account first...");
                    resetVal();
                } else {
                    alert("Wrong password brother... try again maybe?");
                    resetVal();
                }

            }

            async function login(){
                
                console.log("loading...");
                
                const response = await fetch("/api/loginUser", {
                    method: "POST",
                    headers: {                                  //again idk why this exists
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({email: emailBox.value, password: passwordBox.value})
                })
                const data = await response.json();

                    if(response.status == 202){
                        return loginFailed("email");

                    } else if (response.status == 201){

                        return loginFailed("password");
                    }

                    loginSuccessful(data.name, data.id);

            }

            async function register(){
                
                console.log("registering...");

                const response = await fetch("/api/newUser", {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: nameBox.value,
                        email: emailBox.value,
                        password: passwordBox.value,
                        age: ageBox.value
                    })
                });

                const data = await response.json();

                if(response.status == 400){

                    return registerFailed(data.message);

                } else if(response.status == 500){

                    return console.log(data.message);

                }

                registerSuccessful();
            }

            const loginTab = document.querySelector("#login");
            const registerTab = document.querySelector("#register");
            const sub = document.querySelector("#submit");

            function setActive(current, that){
                current.classList.remove("inactive");
                current.classList.add("active");
                that.classList.remove("active");
                that.classList.add("inactive");

            }

            function handleSubmit(e){
                e.preventDefault();
                if(loginTab.classList.contains("active")){
                    login(e);
                } else {
                    register(e);
                }
            }

            sub.addEventListener("click", handleSubmit);

            registerTab.addEventListener("click", function(){

                setActive(registerTab, loginTab);

                sub.textContent = "REGISTER";

                nameBox.classList.remove("hidden");
                ageBox.classList.remove("hidden");

                emailBox.placeholder = "Enter email";
                passwordBox.placeholder = "Set a strong password";

                resetVal();
            });

            loginTab.addEventListener("click", function(){

                setActive(loginTab,registerTab);

                sub.textContent = "LOGIN";

                nameBox.classList.add("hidden");
                ageBox.classList.add("hidden");

                emailBox.placeholder = "Enter email";
                passwordBox.placeholder = "Enter password";

                resetVal();
            });
            
            function resetVal(){
                function resetVal(){
                    passwordBox.value = '';
                    emailBox.value = '';
                    nameBox.value = '';
                    ageBox.value = '';
                }
            }
        </script>
    </body>
</html>
