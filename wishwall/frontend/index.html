<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pulse</title>
    <link rel="stylesheet" href="./public/style/index.css">
    <style>
        :root{ --bg-dark:#140000; --accent-1:#ff3b3b; --accent-2:#ff6a00; --accent-3:#ff2d55; }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;background:radial-gradient(600px 300px at 10% 10%, rgba(255,60,40,0.07), transparent 10%), radial-gradient(600px 250px at 90% 90%, rgba(255,20,20,0.05), transparent 12%), linear-gradient(180deg,#0b0000 0%,#2b0000 100%);color:#fff;overflow:hidden}
        .container{position:relative;z-index:4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px}
        .card{width:880px;max-width:100%;border-radius:16px;padding:48px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);box-shadow:0 18px 50px rgba(0,0,0,0.6);backdrop-filter:blur(8px) saturate(120%)}
        .brand{display:flex;gap:16px;align-items:center}
        .logo{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 120deg,var(--accent-1),var(--accent-2),var(--accent-3));box-shadow:0 10px 40px rgba(255,70,70,0.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px}
        h1{margin:0;font-size:44px;line-height:1.02;color:#fff;text-shadow:0 10px 40px rgba(255,40,40,0.12)}
        .lead{margin:6px 0 0 0;color:#ffd6d6;opacity:0.95;font-size:18px}
        .actions{margin-top:28px;display:flex;align-items:center;gap:12px}
        .btn{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));border:none;color:white;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;box-shadow:0 12px 36px rgba(255,60,60,0.16);transition:transform .18s ease,box-shadow .18s ease}
        .btn:active{transform:translateY(2px)}
        .ghost{background:transparent;color:#ffbdbd;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}

        /* floating background */
        .sky{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;filter:blur(8px) saturate(130%);will-change:transform}
        .float{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0.9;transform:translate3d(0,0,0)}
        .float.large{width:320px;height:320px;background:radial-gradient(circle at 30% 30%, rgba(255,110,70,0.98), rgba(255,40,40,0.6) 30%, rgba(255,20,20,0.08) 60%, transparent 70%);filter:blur(14px)}
        .float.med{width:220px;height:220px;background:radial-gradient(circle at 30% 30%, rgba(255,120,90,0.95), rgba(255,50,50,0.6) 30%, rgba(255,20,20,0.12) 60%, transparent 70%);filter:blur(8px)}
        .float.small{width:120px;height:120px;background:radial-gradient(circle at 30% 30%, rgba(255,100,60,0.95), rgba(255,40,40,0.5) 30%, rgba(255,12,12,0.08) 60%, transparent 70%);filter:blur(4px)}
        .float.alt{background:radial-gradient(circle at 70% 70%, rgba(255,140,30,0.95), rgba(255,80,20,0.5) 30%, rgba(255,40,10,0.08) 60%, transparent 70%);mix-blend-mode:overlay}
        .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,#fff2ea,#ff7a5e);box-shadow:0 10px 30px rgba(255,90,60,0.5);opacity:0.95;mix-blend-mode:screen}

        @keyframes floatA{0%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(30px,-40px,0) rotate(6deg)}100%{transform:translate3d(0,0,0) rotate(0deg)}}
        @keyframes floatB{0%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(-40px,30px,0) rotate(-5deg)}100%{transform:translate3d(0,0,0) rotate(0deg)}}
        @keyframes floatC{0%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(-20px,-30px,0) rotate(8deg)}100%{transform:translate3d(0,0,0) rotate(0deg)}}
        .a{animation:floatA 10s ease-in-out infinite}
        .b{animation:floatB 12s ease-in-out infinite}
        .c{animation:floatC 14s ease-in-out infinite}
        .f1{top:6%;left:4%}
        .f2{top:18%;right:6%}
        .f3{bottom:6%;left:12%}
        .f4{top:30%;left:50%;transform:translateX(-50%)}
        .f5{bottom:18%;right:24%}
        .s1{top:4%;right:24%;animation:floatC 6s ease-in-out infinite}
        .s2{top:46%;left:8%;animation:floatB 7s ease-in-out infinite}
        .s3{bottom:30%;right:12%;animation:floatA 11s ease-in-out infinite}

        @media (max-width:720px){.card{padding:28px;border-radius:12px}h1{font-size:32px}.logo{width:52px;height:52px;font-size:16px}}
    </style>
</head>
<body>
    <div class="sky" aria-hidden="true">
        <div class="float large alt c f4"></div>
        <div class="float med a f1"></div>
        <div class="float med alt b f2"></div>
        <div class="float small c f3"></div>
        <div class="float small alt b f5"></div>

        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
    </div>

    <main class="container">
        <section class="card" role="region" aria-label="Global Pulse landing">
            <div class="brand">
                <div class="logo">GP</div>
                <div>
                    <h1>Global Pulse</h1>
                    <p class="lead">Ignite your ideas. One fiery wish at a time.</p>
                </div>
            </div>

            <div class="actions">
                <button class="btn" onclick="location.href='login.html'">Get Started</button>
                <button class="ghost" onclick="location.href='#'">Maybe Later</button>
                <div style="margin-left:auto;color:#ffbdbd;font-size:14px;align-self:center;">Live • trending</div>
            </div>
        </section>
    </main>

    <script>
        // subtle parallax: move the whole sky slightly on mouse move without interrupting child animations
        (function(){
            const sky = document.querySelector('.sky');
            window.addEventListener('mousemove', e=>{
                const cx = window.innerWidth/2;
                const cy = window.innerHeight/2;
                const dx = (e.clientX - cx)/cx;
                const dy = (e.clientY - cy)/cy;
                const tx = dx * 18;
                const ty = dy * 10;
                sky.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
            });
            window.addEventListener('mouseleave', ()=> sky.style.transform = '');
            window.addEventListener('touchstart', ()=> sky.style.transform = '');
        })();
    </script>
</body>
</html>
