<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    
    <style>
        :root{
            font-size: 62.5%;
            font-family: Arial, Helvetica, sans-serif;
            /* position: fixed; */
        }
        body{
            background-image: url(./public/image/option2.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            font-size:1.6rem;
            font-family: Arial, Helvetica, sans-serif;
            
            
            
        }
        .header{
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-top: 3rem;
        }
        
        .header-div{
            display: flex;
            background-color: rgba(0,0,0, 0.3);
            width: 123rem;
            justify-content: space-around;
            margin-left: 3rem;
            border-radius: 5rem;
            border:0.1rem solid rgba(254, 226, 226, 0.596);
            padding-bottom: 1rem;
           
            
            /* color: white; */
        }
        .header-nav{
            display: flex;
            /* margin-top: 2rem; */
            gap: 5rem;
            font-size: 1.7rem;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 2.5rem;
        }
        .btn-01{
            margin-top: 1.7rem;
            font-size: 1.7rem;
            padding: 1rem;
             border-radius: 5rem;
             width: 26rem;
            font-family: Arial, Helvetica, sans-serif;
            border: 0.1rem solid rgba(254, 226, 226, 0.596);
            background-color: black;
            color: white;
            margin-right: -2.3rem;
        }
        .company-name{
            font-size: 2.5rem;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            margin-top: 2.2rem;
            
        }
        a{
            text-decoration: none;
            color: white;
        
        }
        #message{
            background-color: rgba(150, 71, 71, 0.3);
            border: 0.1rem solid rgba(254, 226, 226, 0.596);
            height: 60rem;
            width: 120rem;
            margin-left: 16rem;
            border-radius: 5rem;
            margin-top: 3cqh;
            padding: 4rem;
            overflow-y: auto;
        }
        
        #msg{
            display: flex;
            justify-content: space-between;
            width: 120rem;
            margin-left: 16rem;
            border-radius: 5rem;
            gap: 3rem;

            
        }
        #inp{
            width: 100rem;
            height: 6rem;
            border-radius: 5rem;
            margin-top: 2.3rem;
            padding: 2rem;
            font-size: 2rem;
            
            margin-left: -1rem;
            background-color: rgba(255, 254, 254, 0.36);
            border: 0.1rem solid rgba(254, 226, 226, 0.596);
            color: white;
        }
        .btn-02{
            border-radius: 5rem;
            
            padding:1rem 2rem 1rem ;
            margin-top: 1rem;
            font-size: 4rem;
            background-color:rgba(250, 169, 169, 0.596);
             border: 0.1rem solid rgba(254, 226, 226, 0.596);

        }

        .btn-03{
            border-radius: 5rem;
            padding:1rem 2rem 1rem ;
            margin-top: 1rem;
            font-size: 4rem;
            margin-left: -2rem;
            margin-top: 1rem;
            background-color:rgba(248, 186, 186, 0.596);
            border: 0.1rem solid rgba(254, 226, 226, 0.596);
            color: black;
        }
        
        .btn-03:hover{
            color: rgb(229, 204, 204);
        }

       
         

        
        
        
    </style>
</head>
<body>
    <header class="header">
        <div class="header-div">
            <p class="company-name">Global Pulse</p>
            <nav class="header-nav">
                <div>
                    <a href="#"><span>HOME</span></a>

                </div>
                <div>
                    <a href="#"><span>ABOUT US</span></a>

                </div>
                <div>
                    <a href="#"><span>CONTACT US</span></a>

                </div>
            </nav>
            <div><button class="btn-01">PROFILE</button></div>
        </div>
    </header>
    <main>
        <div id="message">
            
        </div>

    </main>
    <section>
        <div id="msg">
            <div>
                <button class="btn-02"><span class="bi-patch-plus-fill "></span></button>
            </div>
            <div>
                <input type="text" id="inp">
            </div>
            <div >
                <button class="btn-03" id="send"><span class="bi bi-send-fill "></span></button>
            </div>
        </div>
    </section>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
